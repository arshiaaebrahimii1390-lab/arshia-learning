<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ویرایش پروفایل | Arshia Learning</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  direction: rtl;
  background: linear-gradient(135deg, #eef4ff, #f8fbff);
  min-height: 100vh;
  padding: 25px 16px;
  color: #222;
}

.container {
  max-width: 500px;
  margin: auto;
}

.back {
  display: inline-block;
  text-decoration: none;
  color: #4f7cff;
  font-weight: bold;
  margin-bottom: 18px;
}

.card {
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.8);
  border-radius: 26px;
  padding: 25px;
  box-shadow: 0 10px 35px rgba(50,80,150,0.12);
}

h1 {
  margin-top: 0;
  text-align: center;
  font-size: 25px;
}

.profile-picture {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  margin: 20px auto;
  background: #e9efff;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 4px solid white;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.profile-picture img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.default-icon {
  font-size: 50px;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 7px;
  font-weight: bold;
}

input[type="text"] {
  width: 100%;
  padding: 14px;
  border: none;
  outline: none;
  border-radius: 15px;
  background: rgba(240,244,255,0.9);
  font-size: 15px;
  direction: rtl;
}

.photo-btn {
  display: block;
  text-align: center;
  background: #eef3ff;
  color: #4f7cff;
  padding: 12px;
  border-radius: 15px;
  margin-top: 12px;
  cursor: pointer;
  font-weight: bold;
}

#photoInput {
  display: none;
}

.save-btn {
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  border: none;
  border-radius: 16px;
  background: #4f7cff;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.save-btn:active {
  transform: scale(0.97);
}

.message {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

  <a href="index.html" class="back">← بازگشت به صفحه اصلی</a>

  <div class="card">

    <h1>✏️ ویرایش پروفایل</h1>

    <div class="profile-picture">
      <div class="default-icon" id="defaultIcon">👤</div>
      <img id="profileImage">
    </div>

    <label>نام</label>
    <input
      type="text"
      id="firstName"
      placeholder="نام خود را وارد کنید"
    >

    <label>نام خانوادگی</label>
    <input
      type="text"
      id="lastName"
      placeholder="نام خانوادگی خود را وارد کنید"
    >

    <label>عکس پروفایل</label>

    <label for="photoInput" class="photo-btn">
      📸 انتخاب عکس
    </label>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
    >

    <button class="save-btn" onclick="saveProfile()">
      💾 ذخیره پروفایل
    </button>

    <div class="message" id="message"></div>

  </div>

</div>

<script>

const firstName = document.getElementById("firstName");
const lastName = document.getElementById("lastName");
const photoInput = document.getElementById("photoInput");
const profileImage = document.getElementById("profileImage");
const defaultIcon = document.getElementById("defaultIcon");
const message = document.getElementById("message");


// نمایش اطلاعات ذخیره‌شده
firstName.value = localStorage.getItem("firstName") || "";
lastName.value = localStorage.getItem("lastName") || "";

const savedPhoto = localStorage.getItem("profilePhoto");

if (savedPhoto) {
  profileImage.src = savedPhoto;
  profileImage.style.display = "block";
  defaultIcon.style.display = "none";
}


// انتخاب عکس
photoInput.addEventListener("change", function() {

  const file = this.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {

    profileImage.src = e.target.result;
    profileImage.style.display = "block";
    defaultIcon.style.display = "none";

  };

  reader.readAsDataURL(file);

});


// ذخیره پروفایل
function saveProfile() {

  localStorage.setItem(
    "firstName",
    firstName.value.trim()
  );

  localStorage.setItem(
    "lastName",
    lastName.value.trim()
  );

  if (photoInput.files[0]) {

    const reader = new FileReader();

    reader.onload = function(e) {

      localStorage.setItem(
        "profilePhoto",
        e.target.result
      );

      message.innerText = "✅ پروفایل با موفقیت ذخیره شد";

    };

    reader.readAsDataURL(photoInput.files[0]);

  } else {

    message.innerText = "✅ پروفایل با موفقیت ذخیره شد";

  }
}

</script>

</body>
</html>
