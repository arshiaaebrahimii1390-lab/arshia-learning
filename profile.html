<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پروفایل | Arshia Learning</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #eef3ff, #f8f9ff);
  color: #222;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

.back {
  display: inline-block;
  text-decoration: none;
  color: #4f7cff;
  font-weight: bold;
  margin-bottom: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}

.card {
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(20px);
  border-radius: 25px;
  padding: 22px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.photo-area {
  text-align: center;
  margin-bottom: 25px;
}

.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: #e8edff;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-size: 45px;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-button {
  display: inline-block;
  margin-top: 12px;
  padding: 10px 18px;
  border-radius: 14px;
  background: #4f7cff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

input[type="file"] {
  display: none;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 7px;
  font-weight: bold;
}

input[type="text"] {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 15px;
  background: #f1f3f8;
  font-size: 15px;
  outline: none;
}

.save {
  width: 100%;
  margin-top: 25px;
  padding: 15px;
  border: none;
  border-radius: 17px;
  background: #4f7cff;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.save:active {
  transform: scale(0.98);
}

.message {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
  color: #2e9b52;
}

</style>
</head>

<body>

<div class="container">

<a href="index.html" class="back">← برگشت</a>

<h1>👤 پروفایل من</h1>

<div class="card">

  <div class="photo-area">

    <div class="avatar" id="avatar">
      👤
    </div>

    <label for="photoInput" class="photo-button">
      📷 انتخاب عکس
    </label>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
    >

  </div>

  <label>نام</label>

  <input
    type="text"
    id="firstName"
    placeholder="نام خود را وارد کنید"
  >

  <label>نام خانوادگی</label>

  <input
    type="text"
    id="lastName"
    placeholder="نام خانوادگی خود را وارد کنید"
  >

  <button class="save" onclick="saveProfile()">
    💾 ذخیره پروفایل
  </button>

  <div class="message" id="message"></div>

</div>

</div>

<script>

let selectedPhoto = "";


// نمایش اطلاعات قبلی
function loadProfile() {

  const firstName =
    localStorage.getItem("firstName") || "";

  const lastName =
    localStorage.getItem("lastName") || "";

  const photo =
    localStorage.getItem("profilePhoto") || "";

  document.getElementById("firstName").value =
    firstName;

  document.getElementById("lastName").value =
    lastName;

  if (photo) {

    selectedPhoto = photo;

    document.getElementById("avatar").innerHTML =
      '<img src="' + photo + '">';

  }

}


// انتخاب عکس
document
.getElementById("photoInput")
.addEventListener("change", function(event) {

  const file = event.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {

    selectedPhoto = e.target.result;

    document.getElementById("avatar").innerHTML =
      '<img src="' + selectedPhoto + '">';

  };

  reader.readAsDataURL(file);

});


// ذخیره
function saveProfile() {

  const firstName =
    document.getElementById("firstName").value.trim();

  const lastName =
    document.getElementById("lastName").value.trim();

  localStorage.setItem(
    "firstName",
    firstName
  );

  localStorage.setItem(
    "lastName",
    lastName
  );

  if (selectedPhoto) {

    localStorage.setItem(
      "profilePhoto",
      selectedPhoto
    );

  }

  document.getElementById("message").textContent =
    "✅ پروفایل با موفقیت ذخیره شد!";

}


// اجرا
loadProfile();

</script>

</body>
</html>
